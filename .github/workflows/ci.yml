name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify Go Vet
        run: go vet ./...

      - name: Run Tests
        run: go test -v ./...

      - name: Build Standalone Static Binary
        env:
          CGO_ENABLED: '0'
        run: go build -ldflags="-s -w" -o koality-image-find.exe ./cmd/koality-image-find
