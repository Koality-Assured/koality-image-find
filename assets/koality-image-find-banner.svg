<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="40%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="core-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Backdrop -->
  <rect width="1280" height="400" fill="url(#bg)" />

  <!-- Tech Matrix Blueprint Grid -->
  <g opacity="0.12" stroke="#00F0FF" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" />
    </pattern>
    <rect width="1280" height="400" fill="url(#grid)" />
  </g>

  <!-- High-Tech Data Stream Vectors -->
  <g opacity="0.25">
    <path d="M -50 100 Q 300 60 640 180 T 1330 220" fill="none" stroke="#00F0FF" stroke-width="2" />
    <path d="M -50 280 Q 400 340 780 240 T 1330 140" fill="none" stroke="#7C3AED" stroke-width="2" />
  </g>

  <!-- Left: Hero Graphic Emblematics -->
  <g transform="translate(180, 200)">
    <!-- Concentric Orbit Rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="6 8" opacity="0.4" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="#00F0FF" stroke-width="2" stroke-dasharray="30 15 60 15" opacity="0.7" />
    <circle cx="0" cy="0" r="80" fill="none" stroke="#7C3AED" stroke-width="2" opacity="0.6" />
    
    <!-- Outer Spoke Nodes -->
    <circle cx="0" cy="-140" r="10" fill="#0B0F19" stroke="#00F0FF" stroke-width="3" />
    <circle cx="140" cy="0" r="10" fill="#0B0F19" stroke="#7C3AED" stroke-width="3" />
    <circle cx="0" cy="140" r="10" fill="#0B0F19" stroke="#10B981" stroke-width="3" />
    <circle cx="-140" cy="0" r="10" fill="#0B0F19" stroke="#00F0FF" stroke-width="3" />

    <!-- Central Iconography Transformed -->
    <g transform="translate(-256, -256)">

    <!-- Camera Lens Aperture & Visual Viewfinder Motif -->
    <circle cx="256" cy="256" r="95" fill="none" stroke="#00F0FF" stroke-width="5" />
    <circle cx="256" cy="256" r="82" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="16 8" opacity="0.7" />
    <!-- Aperture Blades -->
    <polygon points="256,180 295,230 240,225" fill="#00F0FF" opacity="0.85" />
    <polygon points="310,215 315,280 270,250" fill="#7C3AED" opacity="0.85" />
    <polygon points="305,290 260,325 255,270" fill="#10B981" opacity="0.85" />
    <polygon points="256,332 217,282 272,287" fill="#00F0FF" opacity="0.85" />
    <polygon points="202,297 197,232 242,262" fill="#7C3AED" opacity="0.85" />
    <polygon points="207,222 252,187 257,242" fill="#10B981" opacity="0.85" />
    <!-- Center Iris Opening -->
    <circle cx="256" cy="256" r="32" fill="#0B0F19" stroke="#00F0FF" stroke-width="3" />
    <circle cx="256" cy="256" r="12" fill="#FFFFFF" />
    <!-- Outer Viewfinder Corner Brackets -->
    <path d="M 170 190 V 170 H 190" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <path d="M 322 170 H 342 V 190" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <path d="M 170 322 V 342 H 190" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <path d="M 322 342 H 342 V 322" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
        
    </g>
  </g>

  <!-- Right: Typography & Capability Badges -->
  <g transform="translate(420, 100)">
    <!-- Overline Category Capsule -->
    <rect x="0" y="0" width="310" height="26" rx="13" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="13" r="5" fill="#00F0FF" filter="url(#glow)" />
    <text x="28" y="17" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">KOALITY-ASSURED • MEDIA ENGINE</text>

    <!-- Project Title -->
    <text x="0" y="72" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="48" font-weight="900" letter-spacing="1">KOALITY IMAGE FIND</text>

    <!-- Subtitle -->
    <text x="0" y="110" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">Ultra-Fast Full-Drive Graphics Image and Video Thumbnail Viewer &amp; Visual Deduplication Engine</text>

    <!-- Capability Chips -->
    <g transform="translate(0, 150)">
      <!-- Chip 1: Multi-Threaded Win32 -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="228" height="38" rx="8" fill="#111827" stroke="#00F0FF" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#00F0FF" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Multi-Threaded Win32</text>
      </g>
      <!-- Chip 2: In-Memory Columnar Index -->
      <g transform="translate(242, 0)">
        <rect x="0" y="0" width="264" height="38" rx="8" fill="#111827" stroke="#7C3AED" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#7C3AED" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">In-Memory Columnar Index</text>
      </g>
      <!-- Chip 3: Visual dHash &amp; MIH -->
      <g transform="translate(520, 0)">
        <rect x="0" y="0" width="210" height="38" rx="8" fill="#111827" stroke="#10B981" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#10B981" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Visual dHash &amp; MIH</text>
      </g>
      <!-- Chip 4: Split Curtain Inspector -->
      <g transform="translate(744, 0)">
        <rect x="0" y="0" width="255" height="38" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="1.5" />
        <circle cx="18" cy="19" r="4" fill="#38BDF8" />
        <text x="32" y="24" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Split Curtain Inspector</text>
      </g>
    </g>
  </g>
</svg>
