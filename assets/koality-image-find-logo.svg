<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#080C14" />
    </linearGradient>
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="4" />

  <!-- Background Geometric Orbit Tracks -->
  <g opacity="0.2" stroke="#475569" stroke-width="1.5">
    <circle cx="256" cy="256" r="210" fill="none" stroke-dasharray="6 8" />
    <circle cx="256" cy="256" r="160" fill="none" />
    <circle cx="256" cy="256" r="110" fill="none" stroke-dasharray="4 6" />
    <line x1="256" y1="46" x2="256" y2="466" />
    <line x1="46" y1="256" x2="466" y2="256" />
  </g>

  <!-- Outer Orbit Nodes -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#accent-cyan)" stroke-width="3" opacity="0.5" stroke-dasharray="40 20 80 20" />
  <g fill="#0B0F19" stroke-width="3">
    <circle cx="256" cy="71" r="14" stroke="#00F0FF" />
    <circle cx="256" cy="71" r="5" fill="#00F0FF" />
    <circle cx="441" cy="256" r="14" stroke="#7C3AED" />
    <circle cx="441" cy="256" r="5" fill="#7C3AED" />
    <circle cx="256" cy="441" r="14" stroke="#10B981" />
    <circle cx="256" cy="441" r="5" fill="#10B981" />
    <circle cx="71" cy="256" r="14" stroke="#00F0FF" />
    <circle cx="71" cy="256" r="5" fill="#00F0FF" />
  </g>

  <!-- Central Emblem Geometry -->
  <g filter="url(#glow)">

    <!-- Camera Lens Aperture & Visual Viewfinder Motif -->
    <circle cx="256" cy="256" r="95" fill="none" stroke="#00F0FF" stroke-width="5" />
    <circle cx="256" cy="256" r="82" fill="none" stroke="#7C3AED" stroke-width="2" stroke-dasharray="16 8" opacity="0.7" />
    <!-- Aperture Blades -->
    <polygon points="256,180 295,230 240,225" fill="#00F0FF" opacity="0.85" />
    <polygon points="310,215 315,280 270,250" fill="#7C3AED" opacity="0.85" />
    <polygon points="305,290 260,325 255,270" fill="#10B981" opacity="0.85" />
    <polygon points="256,332 217,282 272,287" fill="#00F0FF" opacity="0.85" />
    <polygon points="202,297 197,232 242,262" fill="#7C3AED" opacity="0.85" />
    <polygon points="207,222 252,187 257,242" fill="#10B981" opacity="0.85" />
    <!-- Center Iris Opening -->
    <circle cx="256" cy="256" r="32" fill="#0B0F19" stroke="#00F0FF" stroke-width="3" />
    <circle cx="256" cy="256" r="12" fill="#FFFFFF" />
    <!-- Outer Viewfinder Corner Brackets -->
    <path d="M 170 190 V 170 H 190" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <path d="M 322 170 H 342 V 190" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <path d="M 170 322 V 342 H 190" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
    <path d="M 322 342 H 342 V 322" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" />
        
  </g>

  <!-- Bus Trajectory Pulses -->
  <circle cx="176" cy="134" r="4" fill="#00F0FF" filter="url(#glow)" />
  <circle cx="336" cy="134" r="4" fill="#7C3AED" filter="url(#glow)" />
  <circle cx="336" cy="378" r="4" fill="#10B981" filter="url(#glow)" />
  <circle cx="176" cy="378" r="4" fill="#00F0FF" filter="url(#glow)" />
</svg>
